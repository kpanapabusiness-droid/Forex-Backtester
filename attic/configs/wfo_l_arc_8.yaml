# wfo_l_arc_8.yaml — Arc 8 Step 1 plumbing config (L_ARC_PROTOCOL v2.3 stack)
#
# Signal under test: pullback-and-resume in HH/HL uptrend, long (PR-HHHL).
# See signals/lchar_pullback_resume_hhhl.py for the verbatim definition
# and docs/signal_spec_pullback_resume_hhhl_long_v0.1.md for spec.
#
# Protocol: L_ARC_PROTOCOL.md v2.1.2 base + v2.2 amendment + v2.3 amendment.
# §5 (Step 1) + §15a (trades_paths.csv schema). Single pass over the full
# data window — no WFO folds at Step 1 (folds enter at Step 5 = WFO).
#
# Engine path: scripts/l_arc_8/step1_plumbing.py reads this file directly.

phase: L_ARC_8_STEP_1_PLUMBING
description: |
  Arc 8 Step 1 plumbing — full-window trade pool for the PR-HHHL pullback-
  and-resume long signal. 4H signal TF, long-only, single pass over the
  window. Deterministic, §15a-compliant trades_paths.csv (is_held column,
  forward observation bars to entry+240 regardless of exit reason).
  v2.3 Step 1 gates: pool >= 500, byte-identical re-run, lookahead-invariant,
  schema-valid, Phase A spread semantics tests green.

# ----------------------------------------------------------------------
# Signal (verbatim from signals/lchar_pullback_resume_hhhl.py)
# ----------------------------------------------------------------------
signal:
  module: signals.lchar_pullback_resume_hhhl
  trial_id: ARC_8__pullback_resume_hhhl__long__4h__h_240
  family: trend_continuation_structural
  base: pullback_resume_hhhl
  signal_tf: "4H"
  trade_direction: long
  swing_lookback_bars: 3
  trend_window_bars: 30
  right_edge_gap: 4
  min_swing_highs: 2
  min_swing_lows: 2
  pullback_depth_atr_min: 0.5
  trigger_close_pos_min: 0.5
  atr_period: 14
  atr_smoothing: wilder
  refractory_bars: 20

# ----------------------------------------------------------------------
# Data window — locked per signal spec.
# ----------------------------------------------------------------------
data:
  data_dirs:
    "4H": "data/4hr"
  date_start: "2020-10-01"
  date_end: "2026-01-31"

# All 28 FX pairs (identical set to configs/wfo_kh24.yaml).
pairs:
  - AUD_CAD
  - AUD_CHF
  - AUD_JPY
  - AUD_NZD
  - AUD_USD
  - CAD_CHF
  - CAD_JPY
  - CHF_JPY
  - EUR_AUD
  - EUR_CAD
  - EUR_CHF
  - EUR_GBP
  - EUR_JPY
  - EUR_NZD
  - EUR_USD
  - GBP_AUD
  - GBP_CAD
  - GBP_CHF
  - GBP_JPY
  - GBP_NZD
  - GBP_USD
  - NZD_CAD
  - NZD_CHF
  - NZD_JPY
  - NZD_USD
  - USD_CAD
  - USD_CHF
  - USD_JPY

# ----------------------------------------------------------------------
# Entry / exit (per signal spec)
# ----------------------------------------------------------------------
entry:
  bar_offset: 1                  # bar N+1 open
  execution: open                # spread fill via core/SPREAD_SEMANTICS_LOCK

exit:
  hard_stop:
    type: absolute_atr
    atr_period: 14
    atr_smoothing: wilder         # Wilder 4H ATR(14) at signal bar (same as
    atr_tf: "4H"                  # the ATR used in pullback magnitude);
    multiplier: 2.0               # anchored to entry_price.
    anchor: entry_price
  time_exit:
    bars_after_entry: 240         # 240 4H bars = 40 calendar days
  trail: null
  structural_exits: []

# ----------------------------------------------------------------------
# Exposure / risk
# ----------------------------------------------------------------------
exposure:
  max_concurrent_per_pair: 1
  currency_cap: null
  concurrent_trade_cap: null

risk:
  pct_per_trade: 0.005             # 0.5% per L_ARC_PROTOCOL v2.1.2 §1 (L arc)
  starting_balance: 10000.0
  basis: reset_floor

# ----------------------------------------------------------------------
# Spread (locked floor + per-bar MT5 native points)
# ----------------------------------------------------------------------
spreads:
  enabled: true
  source: per_bar                  # MT5 `spread` column from data CSV
  points_per_pip: 10.0
  default_pips: 0.0

spread_floor:
  enabled: true
  source: configs/spread_floors_5ers.yaml
  expected_body_sha256: 8da7644b252ae163d963fbd46807572906fa3e5a44fb3e02d771e181b3ecdc05

# ----------------------------------------------------------------------
# Path output (v2.1.2 §15a)
# ----------------------------------------------------------------------
trade_paths:
  enabled: true
  forward_window_bars: 240        # emit bar_offset 0..240; is_held=0 after exit

# ----------------------------------------------------------------------
# Output
# ----------------------------------------------------------------------
output:
  results_dir: results/l_arc_8/step1_verbatim
  trades_csv: trades_all.csv
  paths_csv: trades_paths.csv
  manifest_json: manifest.json
  audit_lookahead_txt: audit_lookahead.txt
  audit_determinism_txt: audit_determinism.txt
  cofire_csv: cofire_matrix.csv
  float_format: "%.10g"            # mirrors L4 / Arc 3 / Arc 7 output format

# ----------------------------------------------------------------------
# Gate (Step 1 — v2.3 §7 inherits v2.1.2 §5)
# ----------------------------------------------------------------------
gate:
  pool_size_min: 500
  determinism: byte_identical_two_run
  schema_check: v2_1_1_strict      # §15a required columns

# ----------------------------------------------------------------------
# Co-fire matrix (Step 1 mandatory per signal spec §62-68)
# ----------------------------------------------------------------------
cofire:
  vs_signals:
    - name: kh24_kb_exhaustion
      module: signals.kb_exhaustion_bar
      flag_threshold_pct: 10.0
  # Arc 9/10/11 specs not on main; their entries will be added when their
  # respective signal modules land. Co-fire evaluation against missing
  # signals is reported as "n/a — module not present on this branch".
