# Arc 10 v3.0.2 — UTC convention rerun (sidecar override)
#
# This config is a sidecar override of configs/l_arc_10_v3.0.2/arc_open.yaml
# with exactly TWO changes:
#   1. boundary_convention: "5ers_eet"  →  "utc"
#   2. output.results_dir: results/l_arc_10_v3.0.2/step_1
#                       →  results/l_arc_10_v3_0_2_utc_rerun/step_1
#
# All other fields are byte-identical to the locked v3.0.2 arc_open. The
# convention switch is the substantive change per dispatch §5.1; the
# output redirect is mechanically required so the rerun does not clobber
# v3.0.2's locked step_1 artefacts.
#
# Phase branch: phase/arc_10_v3_0_2_utc_rerun
# Anchor: arc-10-v3.0.2-DEPLOYABLE (commit 244fb76)
# See: utc_rerun_intent.md
# Signal: D1 swing-low rejection long (DLR), v0.1 per
# docs/archive/signal_specs/signal_spec_d1_swing_low_rejection_long_v0.1.md
# Protocol: L_PROTOCOL.md v3.0 vanilla + Amendment 5/5.1 + Amendment 6 EET boundary
# Engine: v3 backtester post PR #185/#186/#188/#189/#193/#194/#195/#197/#201/#207/#208

arc_name: l_arc_10_v3.0.2
protocol_version: v3.0.2
sub_protocol: vanilla

# Convention overridden to UTC for this rerun. The v3.0.2 closure ran under
# "5ers_eet"; this rerun characterises the UTC delta on the same signal +
# winning config. NOT a methodology change to v3.0.2 itself.
boundary_convention: "utc"

# HistData lives in the main checkout (worktree gitignores data/histdata content).
# Cache writes go to data/cache in the worktree (worktree-local junction to
# main-repo's pre-built UTC cache at data/cache/{H4,D1,W1}/<PAIR>.parquet).
data:
  histdata_root: "C:/Users/panap/Documents/Forex-Backtester/data/histdata"
  cache_root: "data/cache"

window:
  start: "2010-01-01"
  end: "2026-04-30"

tf:
  primary: H4
  anchor: D1
  cross_pair_aux: [D1, W1]

pairs:
  - AUDCAD
  - AUDCHF
  - AUDJPY
  - AUDNZD
  - AUDUSD
  - CADCHF
  - CADJPY
  - CHFJPY
  - EURAUD
  - EURCAD
  - EURCHF
  - EURGBP
  - EURJPY
  - EURNZD
  - EURUSD
  - GBPAUD
  - GBPCAD
  - GBPCHF
  - GBPJPY
  - GBPNZD
  - GBPUSD
  - NZDCAD
  - NZDCHF
  - NZDJPY
  - NZDUSD
  - USDCAD
  - USDCHF
  - USDJPY

risk_per_trade: 0.005  # 0.5% per L arc convention

signal:
  module: signals.lchar_dlr_long
  spec: docs/archive/signal_specs/signal_spec_d1_swing_low_rejection_long_v0.1.md
  # Mirror of locked module constants — asserted at runtime.
  d1_swing_window_k: 3
  d1_right_edge_offset: 4
  d1_structure_lookback_bars: 30
  d1_l1_freshness_max_bars: 20
  atr_period_4h: 14
  proximity_atr_mult: 0.25
  reject_buffer_atr_mult: 0.10
  upper_fraction_min: 0.6
  refractory_bars_4h: 20

step_1:
  sl:
    atr_period: 14
    atr_multiplier: 2.0
  exit:
    horizon_bars: 240
    path_forward_bars: 240
  exposure:
    cap_mode: unrestricted     # Step 5 sweeps {2, unlimited}
  features:
    use_default_27: true
    arc_extras:
      - L1_value
      - L0_value
      - L1_age_d1_bars
      - L0_age_d1_bars
      - L1_to_atr_proximity
      - reject_buffer_atr
      - upper_fraction
      - atr14_at_signal
  integrity:
    lookahead_spotcheck_n: 10
    d1_lag_nan_perturbation_n: 5
    require_two_run_determinism: true

# Output redirected to the rerun's results directory. All step_N
# scripts derive arc_root = Path(output.results_dir).parent so the
# entire pipeline (Steps 1->5) lands under results/l_arc_10_v3_0_2_utc_rerun/.
output:
  results_dir: results/l_arc_10_v3_0_2_utc_rerun/step_1
  pool_parquet: pool.parquet
  integrity_md: integrity_report.md
  manifest_json: manifest.json
  float_format: "%.10g"
