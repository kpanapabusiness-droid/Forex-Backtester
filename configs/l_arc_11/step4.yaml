# Arc 11 — Step 4 extractability config (L_ARC_PROTOCOL v2.3 §§8, 10, 17 + v2.2 §3).
#
# Per Step 3 surviving units (c1 SL=3.0, c3 SL=2.0, agg_c1_c3 SL=3.0):
# - Pipeline E: 8 cross-dataset base features + arc-11 specific features.
#   Gate: RF mean ROC-AUC >= 0.65 across 5 TimeSeriesSplit folds.
# - Pipeline D1 (deferred-identification, path-so-far at bar t):
#   Sweep t in {1, 2, 3, 4, 5, 10}; smallest-t rule (AUC >= 0.60 AND
#   exclusion <= 0.30).
# - Threshold sweep (v2.2 §3, no max-F1 fallback): {0.40, 0.50, 0.60, 0.70},
#   select max precision with recall >= 0.60.
#
# Per v2.3 §5 / Open-24: pre_t_sl_atr_multiplier per archetype = its Step 3
# selected SL (recorded in extractability_pass_list.csv).

phase: L_ARC_11_STEP_4_EXTRACTABILITY

input:
  step1_dir: results/l_arc_11/step1_verbatim
  trades_csv: trades_all.csv
  paths_csv: trades_paths.csv
  step2_dir: results/l_arc_11/step2
  clusters_csv: clusters_K4.csv
  step3_dir: results/l_arc_11/step3
  pass_list_csv: capturability_pass_list.csv

output:
  results_dir: results/l_arc_11/step4
  summary_md: STEP4_SUMMARY.md
  determinism_check: true

# Step 1 sim SL was 2.0 x ATR — used to scale R-denomination via _eval_trade_at_sl.
original_sl_atr_mult: 2.0

# Surviving units from Step 3 (mirror; do not regenerate).
units:
  - unit_id: c1
    type: cluster
    cluster_ids: [1]
    selected_sl_atr_mult: 3.0
  - unit_id: c3
    type: cluster
    cluster_ids: [3]
    selected_sl_atr_mult: 2.0
  - unit_id: agg_c1_c3
    type: aggregate
    cluster_ids: [1, 3]
    selected_sl_atr_mult: 3.0

# §8 gate thresholds.
gates:
  pipeline_e_auc_min: 0.65
  pipeline_d1_auc_min: 0.60

# Classifier (deterministic).
model:
  type: random_forest
  n_estimators: 200
  max_depth: 8
  random_state: 42
  n_jobs: 1
  class_weight_balanced_threshold: 0.30

# Cross-validation.
cv:
  type: time_series_split
  n_splits: 5
  order_by: entry_time

# Data path for 4H raw bars (for cross-dataset base feature recomputation).
data:
  dir_4h: C:/Users/panap/Documents/Forex-Backtester/data/4hr
