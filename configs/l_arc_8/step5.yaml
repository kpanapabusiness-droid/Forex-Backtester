# Runs WFO on (c1, Pipeline E) and (c1, Pipeline D1) independently.
# c1 archetype: V-shape recovery (forward-geometry weak).
# Unit selected SL: 4.0×ATR_4H (entry-anchored).
# pre_t_sl_atr_multiplier (D1 only): 4.0 — consumed by feat/open-24-pre-t-sl-
# per-archetype merged into main at 716ce84.
