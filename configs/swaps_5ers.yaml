# Friday rollover multiplier (standard FX convention: weekend interest accrues on Friday rollover).
friday_multiplier: 3.0

# Rollover instant in UTC by DST period.
# 5ers / standard FX broker rollover is at 17:00 ET (close of NY trading day):
#   EDT (summer, US-DST in effect): 17:00 EDT = 21:00 UTC
#   EST (winter, US-DST NOT in effect): 17:00 EST = 22:00 UTC
# == 24:00 EET (broker timezone) year-round.
rollover_utc_summer: "21:00"
rollover_utc_winter: "22:00"
