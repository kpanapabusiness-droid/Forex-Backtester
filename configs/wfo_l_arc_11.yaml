# wfo_l_arc_11.yaml — Arc 11 v3.0 config (L_PROTOCOL v3.0, sub-protocol vanilla)
#
# Distinct from attic/configs/wfo_l_arc_11.yaml (v2-era). v3.0 engine drops
# external spread floor (HistData M1 bid+ask is canonical per L_PROTOCOL §1)
# and uses 2010-01-01 → 2026-04-30 (most-recent-complete-month) window per
# dispatch.

arc_name: l_arc_11
phase: ARC_11_V3
description: |
  Arc 11 v3.0 — swing-high breakout in trend (SHB), long, 4H, vanilla
  L_PROTOCOL v3.0 (incl. Amendments 1 + 2). 28 FX, 0.5% risk, 2010-2026-04
  window, 2.0×ATR Step-1 SL (Step 3 sweeps), 240-bar (40-day) time exit.
  Goal: PASS-DEPLOYABLE / PASS-VIABLE survivor or documented FAIL with
  diagnostics per L_PROTOCOL §6.

# ── Signal (verbatim from signals/lchar_swing_high_breakout_trend.py) ──
signal:
  module: signals.lchar_swing_high_breakout_trend
  family: trend_continuation_structural_breakout
  base: swing_high_breakout
  signal_tf: H4
  trade_direction: long
  swing_k: 3
  trend_filter_lookback: 30
  h_ref_lookback: 20
  right_edge_offset: 4
  atr_period: 14
  atr_smoothing: wilder
  break_buffer_atr: 0.10
  close_upper_half_min: 0.5
  refractory_bars: 20

# ── Data ──────────────────────────────────────────────────────────────
data:
  # Absolute paths to parent repo (worktree only has the manifest; the 66 GB
  # of M1 CSVs and the H4/D1/W1 parquet cache live in the parent repo so other
  # parallel arc sessions can reuse).
  histdata_root: "C:/Users/panap/Documents/Forex-Backtester/data/histdata"
  cache_root: "C:/Users/panap/Documents/Forex-Backtester/data/cache"
  date_start: "2010-01-01"
  date_end: "2026-04-30"

pairs:
  - AUDCAD
  - AUDCHF
  - AUDJPY
  - AUDNZD
  - AUDUSD
  - CADCHF
  - CADJPY
  - CHFJPY
  - EURAUD
  - EURCAD
  - EURCHF
  - EURGBP
  - EURJPY
  - EURNZD
  - EURUSD
  - GBPAUD
  - GBPCAD
  - GBPCHF
  - GBPJPY
  - GBPNZD
  - GBPUSD
  - NZDCAD
  - NZDCHF
  - NZDJPY
  - NZDUSD
  - USDCAD
  - USDCHF
  - USDJPY

# ── Trade mechanics (Step 1 defaults; Step 3+ sweep SL) ────────────────
entry:
  bar_offset: 1                  # bar t+1 open
  long_fill: open_ask            # per core.sim.fill long-entry semantics

exit:
  hard_stop:
    type: absolute_atr
    atr_period: 14
    atr_smoothing: wilder
    atr_tf: H4
    multiplier: 2.0
    anchor: entry_price
  time_exit:
    bars_after_entry: 240        # 240 H4 bars = 40 calendar days
  trail: null
  structural_exits: []

# ── Exposure / risk ────────────────────────────────────────────────────
exposure:
  max_concurrent_per_pair: 1
  max_concurrent_per_currency: null     # Step 1 = unrestricted; Step 5 sweeps {2, unlimited}
  max_concurrent_total: null

risk:
  pct_per_trade: 0.005           # 0.5% per L arc convention
  starting_balance: 100000.0
  basis: reset_floor

# ── WFO (Step 5) ──────────────────────────────────────────────────────
wfo:
  train_window: ["2010-01-01", "2020-12-31"]
  fold_size_years: 1
  n_folds: 11
  holdout_window: ["2021-01-01", "2026-04-30"]
  holdout_evaluation: one_shot

# ── Step 1 output / gates ─────────────────────────────────────────────
output:
  results_dir: results/l_arc_11
  float_format: "%.10g"

step_1:
  pool_size_min: 500
  determinism: byte_identical_two_run
  right_edge_audit_max_bar_offset: 4
  lookahead_spotcheck_n_trades: 10     # dispatch: elevated from default 5

# ── Step 2 ────────────────────────────────────────────────────────────
step_2:
  k_values: [2, 3, 4, 5, 6]
  silhouette_min_diagnostic: 0.30
  cluster_algorithm: kmeans

# ── Step 3 ────────────────────────────────────────────────────────────
step_3:
  sl_sweep_multipliers: [1.5, 2.0, 2.5, 3.0, 3.5, 4.0]
  candidate_cluster:
    reach_1r_min: 0.50
    ww_pp_max: 0.30
    mfe_p50_min: 1.5

# ── Step 4 ────────────────────────────────────────────────────────────
step_4:
  cv_splits: 5
  classifiers: [random_forest, lgbm, logistic]
  rf:
    n_estimators: 200
    max_depth: 6
    min_samples_leaf: 50
    random_state: 42
  lgbm:
    n_estimators: 200
    num_leaves: 31
    learning_rate: 0.05
    min_child_samples: 50
    random_state: 42
  logistic:
    penalty: l2
    C: 1.0
    max_iter: 1000
    random_state: 42
  feature_importance_top_n: 10

# ── Step 5 ────────────────────────────────────────────────────────────
step_5:
  exposure_caps: [2, null]                       # null = unlimited
  exit_policies_default:                         # always include sl_only
    - sl_only
  pipeline_de_n_bars: [3, 5]
  pipeline_d_exit_thresholds: [0.3, 0.4, 0.5]
  meta_label_thresholds: [[0.3, 0.5], [0.4, 0.6], [0.5, 0.7]]
  top_k_holdout: 3

# ── Determinism ──────────────────────────────────────────────────────
determinism:
  random_state: 42
  n_jobs: 1
  line_terminator: "\n"
